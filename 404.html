<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없어요 — I.D. Toy</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="512x512" href="/idtoy-website/assets/icons/favicon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100svh; display: grid; place-items: center;
    font-family: "Pretendard Variable", Pretendard, sans-serif;
    background:
      radial-gradient(46% 70% at 12% 18%, rgba(255,233,168,.5), transparent 70%),
      radial-gradient(50% 75% at 88% 30%, rgba(201,223,245,.45), transparent 70%),
      #FFF9F0;
    color: #4A3B30; text-align: center; padding: 24px;
  }
  .lost__emoji { font-size: 72px; display: block; margin-bottom: 18px; animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg);} 50% { transform: translateY(-10px) rotate(4deg);} }
  h1 { font-family: "Jua", sans-serif; font-weight: 400; font-size: clamp(1.8rem, 5vw, 2.6rem); margin-bottom: 10px; }
  p { color: #9C8B7B; margin-bottom: 28px; }
  .lost__actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-block; text-decoration: none;
    font-family: "Fredoka", "Pretendard Variable", sans-serif; font-weight: 600; font-size: 15px;
    padding: 14px 30px; border-radius: 999px; transition: transform .25s ease;
  }
  a.btn:hover { transform: translateY(-3px); }
  .btn--dark { background: #4A3B30; color: #FFF9F0; }
  .btn--light { background: #fff; color: #4A3B30; border: 2px solid rgba(74,59,48,.14); }
</style>
</head>
<body>
<div>
  <span class="lost__emoji" aria-hidden="true">🧸</span>
  <h1>어라, 길을 잃었어요</h1>
  <p>찾으시는 페이지가 없거나 이사를 갔어요.<br>The page you're looking for doesn't exist.</p>
  <div class="lost__actions">
    <a class="btn btn--dark" href="/idtoy-website/">홈으로 가기</a>
    <a class="btn btn--light" href="/idtoy-website/collection.html">쇼케이스 구경하기</a>
  </div>
</div>
</body>
</html>
